site_name: ppigFinder
site_description: Protein–Protein Interaction Genomic Finder
site_url: https://leepusp.github.io/ppigfinder/
repo_url: https://github.com/leepusp/ppigfinder
repo_name: leepusp/ppigfinder
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - User Guide:
      - Complete Guide: user_manual/complete_guide.md
      - Quick Start: user_manual/quick_start_v29_14.md
      - Installation: user_manual/installation.md
      - Genome Loading: user_manual/genome.md
      - ORF Prediction: user_manual/orf_prediction.md
      - Annotation: user_manual/annotation.md
      - AlphaFold and PPI: user_manual/alphafold.md
      - HPC Submission: user_manual/hpc_submission.md
      - DaVinci Example: user_manual/davinci_hpc.md
      - Results and Reports: user_manual/reports.md
      - Troubleshooting: user_manual/troubleshooting.md
  - Developer Guide:
      - Architecture: developer/software_architecture.md
      - Directory Layout: developer/directory_layout.md
      - HPC Portability: developer/hpc_portability.md
      - Structure Prediction: developer/structure_prediction/README.md
